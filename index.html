<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhận Diện Vợ Yeuu 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:Quicksand;
      background:#ffdfe6;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      color:#b3295a
    }
    .card{
      background:#ffe6ec;
      border-radius:18px;
      padding:24px;
      max-width:420px;
      width:100%;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      transition:opacity .8s ease
    }
    h1{color:#ff6b9a}
    video{
      width:100%;
      border-radius:12px;
      margin-top:12px;
      transform: scaleX(-1);
    }
    button{
      margin-top:14px;
      padding:10px 18px;
      border-radius:10px;
      border:none;
      background:#ff6b9a;
      color:#fff;
      font-weight:700;
      font-size:16px;
      cursor:pointer
    }
    .status{
      margin-top:10px;
      font-size:14px;
      opacity:.85
    }
  </style>
</head>

<body>

<div class="card" id="card">
  <h1>📷 Xác Nhận Vợ Yeuu</h1>
  <p>Bức Thư Dành Cho Em💖</p>
  <video id="video" autoplay muted playsinline></video>
  <div class="status" id="status">Khuôn Mặt Xinh Đẹp Đâu Roii</div>
  <button id="start">Bắt đầu nhận diện</button>
</div>

<!-- face-api -->
<script src="https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
const video = document.getElementById('video');
const btn = document.getElementById('start');
const card = document.getElementById('card');
const statusText = document.getElementById('status');

const AUTH_IMAGE = '2.jpg';
let faceMatcher;
let bgMusic;

// bật camera
async function startCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({ video:true });
  video.srcObject = stream;
  await new Promise(resolve=>{
    video.onloadedmetadata = ()=>{
      video.play();
      resolve();
    }
  });
}

// load model
async function loadModels(){
  statusText.innerText = '⏳ Đang Ngắm Nhìn Nhan Sắc🥺...';
  const MODEL_URL =
    'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
}

// load ảnh được phép
async function loadAuthorizedFace(){
  statusText.innerText = '📸 Đang Say Mê Nhan Sắc Này🥺...';

  const img = await faceapi.fetchImage(AUTH_IMAGE);
  const detection = await faceapi
    .detectSingleFace(
      img,
      new faceapi.TinyFaceDetectorOptions({
        inputSize:224,
        scoreThreshold:0.5
      })
    )
    .withFaceLandmarks()
    .withFaceDescriptor();

  if(!detection){
    alert('❌ Không nhận diện được khuôn mặt trong ảnh 1.jpg');
    throw new Error('No face');
  }

  const labeled = new faceapi.LabeledFaceDescriptors(
    'my-love',
    [detection.descriptor]
  );

  faceMatcher = new faceapi.FaceMatcher(labeled, 0.5);
}

// nút bắt đầu
btn.onclick = async ()=>{
  btn.disabled = true;
  btn.innerText = 'Đang nhận diện...';

  try{
    await loadModels();
    await loadAuthorizedFace();
    await startCamera();

    statusText.innerText = 'Bắt Đầu Xác Nhận...';

    const interval = setInterval(async ()=>{
      const result = await faceapi
        .detectSingleFace(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize:224,
            scoreThreshold:0.5
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

      if(result && faceMatcher){
        const match = faceMatcher.findBestMatch(result.descriptor);
        if(match.label === 'my-love'){
          clearInterval(interval);
          unlock();
        }
      }
    },700);

  }catch(e){
    alert('Có lỗi xảy ra, mở Console để xem');
    console.error(e);
  }
};

// mở khóa + phát nhạc
function unlock(){
  statusText.innerText = '💖 Đã nhận diện thành công';

  if(!bgMusic){
    bgMusic = new Audio('Shiki, Low G, Justatee - In Love x Có Đôi Điều (Pizuh Mashup) - Pizuh (youtube).mp3'); // 👈 đổi nhạc tại đây
    bgMusic.loop = true;
    bgMusic.volume = 0.6;
    bgMusic.play();
  }

  card.style.opacity = 0;
  setTimeout(()=>{
    card.innerHTML = `
  <h1>💌 Bức Thư Dành Riêng Cho Em 💖</h1>

<p style="font-size:18px; line-height:1.7">
Gửi Embe dễ huôngg cụa anh 💌<br><br>

Anh đã ngồi rất lâu trước khi viết những dòng này, vì anh sợ… sợ rằng lời anh viết ra sẽ không đủ để nói hết những gì anh cảm nhận về em. Nhưng nếu anh không nói, anh lại sợ em sẽ không bao giờ biết rằng em quan trọng với anh đến nhường nào.<br><br>

Valentine này, anh tặng em một chú gấu bông nhỏ. Có thể với người khác nó chỉ là một món quà đơn giản, nhưng với anh... nó giống như một phần trái tim anh được gửi đến bên em.<br><br>

Trên hai bên tai của chú thỏ có thêu tên của chúng ta — như một lời nhắn nhủ dịu dàng rằng ở đâu có em, ở đó luôn có anh. Anh mong khi em ôm chú thỏ, em sẽ cảm thấy được yêu thương, được che chở, giống như cách anh muốn ôm em vào lòng mỗi khi em mệt mỏi.<br><br>

Anh còn để vào đó thật nhiều kẹo chipchip. Không phải chỉ vì anh biết em dễ tụt đường, mà vì anh muốn em luôn có thứ gì đó ngọt ngào bên cạnh, kể cả khi anh không ở ngay đó. Anh muốn dù anh ở xa hay gần, em vẫn cảm nhận được sự quan tâm của anh đang ở rất gần em.<br><br>

Em à, anh không hứa sẽ là người hoàn hảo, nhưng anh hứa sẽ luôn là người thật lòng. Anh không chắc mình có thể cho em cả thế giới, nhưng anh chắc chắn một điều, thế giới của anh luôn có em ở trung tâm.<br><br>

Nếu một ngày em thấy mệt, thấy buồn, thấy yếu lòng… hãy nhớ rằng ở đâu đó vẫn có một người luôn chọn em, luôn thương em, và luôn muốn nắm tay em đi qua mọi điều.<br><br>

Cảm ơn em vì đã xuất hiện trong cuộc đời anh, vì đã khiến trái tim anh biết rung động, biết mong chờ, biết nhớ nhung và biết yêu thương nhiều đến thế.<br><br>

Valentine này, và rất nhiều Valentine sau nữa… anh vẫn muốn người anh viết thư là em, người anh chuẩn bị quà là em, và người anh thương nhất vẫn chỉ là em.<br><br>

<strong>Anh Yêu Vợ ❤</strong>
</p>
`;
    card.style.opacity = 1;
  },800);
}
</script>

</body>

</html>
